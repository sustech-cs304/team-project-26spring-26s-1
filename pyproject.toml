[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sustech-agent"
version = "0.1.0"
description = "A simple RAG agent."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "langchain>=1.2.10",
    "mem0ai>=1.0.4",
    "prompt-toolkit>=3.0.52",
    "qdrant-client>=1.9",
    "tiktoken>=0.12.0",
]

[tool.setuptools.package-data]
agent = ["templates/*.j2"]

[project.scripts]
agent = "agent.main:main"
agent-ingest = "agent.ingest:main"
