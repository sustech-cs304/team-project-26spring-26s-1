{% extends "base.html" %}
{% block title %}已上架管理 - 2026 opencrab{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto space-y-6 fade-in">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100">
            <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                已上架技能管理
            </h2>
        </div>
        <div id="skillsList" class="p-6"></div>
    </div>
</div>

<!-- Edit Modal -->
<div class="fixed inset-0 bg-slate-900/50 z-50 hidden items-center justify-center" id="editModal">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <h3 class="font-semibold text-slate-800">编辑技能</h3>
            <button onclick="closeEditModal()" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <form id="editForm" class="p-6 space-y-4">
            <input type="hidden" id="editSkillId">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">描述</label>
                <textarea id="editDescription" rows="3"
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none resize-none bg-slate-50/50 hover:bg-slate-50 transition-colors"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">标签</label>
                <div id="editTagsContainer" class="flex flex-wrap gap-2"></div>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="button" onclick="closeEditModal()"
                    class="flex-1 py-3 px-4 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200 transition-all">
                    取消
                </button>
                <button type="submit"
                    class="flex-1 py-3 px-4 bg-gradient-to-r from-violet-600 to-purple-600 text-white font-medium rounded-xl shadow-lg shadow-violet-500/30 hover:shadow-violet-500/50 hover:from-violet-700 hover:to-purple-700 transform hover:-translate-y-0.5 transition-all duration-200">
                    保存
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    let allTags = [];
    let selectedEditTags = [];

    async function loadApprovedSkills() {
        try {
            const skills = await api('/admin/skills/approved');
            const container = document.getElementById('skillsList');

            if (skills.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center py-16">暂无已上架技能</p>';
                return;
            }

            container.innerHTML = `
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="text-left text-sm text-slate-500 border-b border-slate-100">
                                <th class="pb-3 font-medium">名称</th>
                                <th class="pb-3 font-medium">描述</th>
                                <th class="pb-3 font-medium">标签</th>
                                <th class="pb-3 font-medium">下载量</th>
                                <th class="pb-3 font-medium">上架时间</th>
                                <th class="pb-3 font-medium">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${skills.map(s => `
                                <tr class="hover:bg-slate-50 transition-colors">
                                    <td class="py-4 font-medium text-slate-800">${s.name}</td>
                                    <td class="py-4 text-slate-600 text-sm max-w-xs truncate">${s.description || '-'}</td>
                                    <td class="py-4">
                                        <div class="flex flex-wrap gap-1">
                                            ${s.tags.map(t => `<span class="px-2 py-0.5 bg-violet-100 text-violet-700 rounded text-xs font-medium">${t.name}</span>`).join('')}
                                        </div>
                                    </td>
                                    <td class="py-4 text-slate-600">${s.download_count}</td>
                                    <td class="py-4 text-slate-500 text-sm">${s.created_at ? new Date(s.created_at).toLocaleDateString() : '-'}</td>
                                    <td class="py-4">
                                        <div class="flex gap-2">
                                            <button onclick="editSkill(${s.id}, '${escapeHtml(s.description || '')}', [${s.tags.map(t => t.id).join(',')}])" 
                                                class="px-3 py-1.5 bg-slate-100 text-slate-700 font-medium rounded-lg hover:bg-slate-200 transition-all text-sm">
                                                编辑
                                            </button>
                                            <button onclick="archiveSkill(${s.id})" 
                                                class="px-3 py-1.5 bg-red-50 text-red-600 font-medium rounded-lg hover:bg-red-100 transition-all text-sm">
                                                下架
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    async function loadAllTags() {
        allTags = await api('/api/tags');
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function editSkill(id, description, currentTagIds) {
        document.getElementById('editSkillId').value = id;
        document.getElementById('editDescription').value = description;
        selectedEditTags = currentTagIds || [];

        const container = document.getElementById('editTagsContainer');
        container.innerHTML = allTags.map(t => `
            <label class="cursor-pointer px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${selectedEditTags.includes(t.id) ? 'bg-violet-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                <input type="checkbox" value="${t.id}" ${selectedEditTags.includes(t.id) ? 'checked' : ''} onchange="toggleEditTag(${t.id})" class="hidden">
                ${t.name}
            </label>
        `).join('');

        document.getElementById('editModal').classList.remove('hidden');
        document.getElementById('editModal').classList.add('flex');
    }

    function toggleEditTag(id) {
        if (selectedEditTags.includes(id)) {
            selectedEditTags = selectedEditTags.filter(t => t !== id);
        } else {
            selectedEditTags.push(id);
        }

        const labels = document.querySelectorAll('#editTagsContainer label');
        labels.forEach(label => {
            const checkbox = label.querySelector('input');
            if (selectedEditTags.includes(parseInt(checkbox.value))) {
                label.classList.remove('bg-slate-100', 'text-slate-600');
                label.classList.add('bg-violet-600', 'text-white');
                checkbox.checked = true;
            } else {
                label.classList.remove('bg-violet-600', 'text-white');
                label.classList.add('bg-slate-100', 'text-slate-600');
                checkbox.checked = false;
            }
        });
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.add('hidden');
        document.getElementById('editModal').classList.remove('flex');
    }

    document.getElementById('editForm').onsubmit = async function (e) {
        e.preventDefault();
        const id = document.getElementById('editSkillId').value;
        const description = document.getElementById('editDescription').value;

        try {
            await api(`/admin/skills/${id}`, {
                method: 'PUT',
                body: JSON.stringify({ description, tag_ids: selectedEditTags })
            });
            showToast('更新成功', 'success');
            closeEditModal();
            loadApprovedSkills();
        } catch (e) {
            showToast(e.message, 'error');
        }
    };

    async function archiveSkill(id) {
        try {
            await api(`/admin/skills/${id}/archive`, { method: 'POST' });
            showToast('已下架', 'success');
            loadApprovedSkills();
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    (async () => {
        await loadAllTags();
        await loadApprovedSkills();
    })();
</script>
{% endblock %}
