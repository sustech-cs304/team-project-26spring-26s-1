{% extends "base.html" %}
{% block title %}管理面板 - 2026 opencrab{% endblock %}
{% block content %}
<div class="space-y-6 fade-in">
    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 p-6 hover:shadow-xl transition-shadow">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <span class="text-xs font-medium text-amber-600 bg-amber-50 px-2 py-1 rounded-full">待处理</span>
            </div>
            <div class="text-3xl font-bold text-slate-800" id="pendingCount">-</div>
            <div class="text-sm text-slate-500 mt-1">待审核</div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 p-6 hover:shadow-xl transition-shadow">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <span class="text-xs font-medium text-green-600 bg-green-50 px-2 py-1 rounded-full">已上线</span>
            </div>
            <div class="text-3xl font-bold text-slate-800" id="approvedCount">-</div>
            <div class="text-sm text-slate-500 mt-1">已上架</div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 p-6 hover:shadow-xl transition-shadow">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                    </svg>
                </div>
                <span class="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-1 rounded-full">增长</span>
            </div>
            <div class="text-3xl font-bold text-slate-800" id="weekNew">-</div>
            <div class="text-sm text-slate-500 mt-1">本周新增</div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 p-6 hover:shadow-xl transition-shadow">
            <div class="flex items-center justify-between mb-4">
                <div class="w-12 h-12 bg-violet-100 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-violet-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </div>
                <span class="text-xs font-medium text-violet-600 bg-violet-50 px-2 py-1 rounded-full">总计</span>
            </div>
            <div class="text-3xl font-bold text-slate-800" id="totalDownloads">-</div>
            <div class="text-sm text-slate-500 mt-1">总下载</div>
        </div>
    </div>

    <!-- Quick Actions & Tags -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Quick Actions -->
        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-semibold text-slate-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    快捷操作
                </h3>
            </div>
            <div class="p-6 space-y-4">
                <div class="flex gap-3">
                    <button onclick="location.href='/admin/pending'"
                        class="flex-1 py-3 px-4 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-medium rounded-xl shadow-lg shadow-amber-500/30 hover:shadow-amber-500/50 hover:from-amber-600 hover:to-orange-600 transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        待审核 (<span id="pendingBadge">0</span>)
                    </button>
                    <button onclick="location.href='/admin/skills'"
                        class="flex-1 py-3 px-4 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200 transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        已上架管理
                    </button>
                </div>
            </div>
        </div>

        <!-- Tag Management -->
        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100">
                <h3 class="font-semibold text-slate-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                    </svg>
                    标签管理
                </h3>
            </div>
            <div class="p-6 space-y-4">
                <div class="flex gap-2">
                    <input type="text" id="newTagName" placeholder="新标签名称"
                        class="flex-1 px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all bg-slate-50/50 hover:bg-slate-50 focus:bg-white outline-none">
                    <button onclick="addTag()"
                        class="px-6 py-3 bg-gradient-to-r from-violet-600 to-purple-600 text-white font-medium rounded-xl shadow-lg shadow-violet-500/30 hover:shadow-violet-500/50 hover:from-violet-700 hover:to-purple-700 transform hover:-translate-y-0.5 transition-all duration-200">
                        添加
                    </button>
                </div>
                <div id="tagsList" class="flex flex-wrap gap-2"></div>
            </div>
        </div>
    </div>

    <!-- Recent Pending -->
    <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100">
            <h3 class="font-semibold text-slate-800 flex items-center gap-2">
                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                最近待审核
            </h3>
        </div>
        <div id="recentPending" class="p-6"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    async function loadDashboard() {
        try {
            const data = await api('/admin/dashboard');
            document.getElementById('pendingCount').textContent = data.pending_count;
            document.getElementById('pendingBadge').textContent = data.pending_count;
            document.getElementById('approvedCount').textContent = data.approved_count;
            document.getElementById('weekNew').textContent = data.week_new;
            document.getElementById('totalDownloads').textContent = data.total_downloads;
        } catch (e) {
            console.error(e);
        }
    }

    async function loadTags() {
        const tags = await api('/admin/tags');
        document.getElementById('tagsList').innerHTML = tags.map(t =>
            `<span class="px-3 py-1.5 bg-violet-100 text-violet-700 rounded-lg text-sm font-medium">${t.name}</span>`
        ).join('');
    }

    async function addTag() {
        const name = document.getElementById('newTagName').value.trim();
        if (!name) return;
        try {
            await api('/admin/tags', {
                method: 'POST',
                body: JSON.stringify({ name }),
                headers: { 'Content-Type': 'application/json' }
            });
            document.getElementById('newTagName').value = '';
            loadTags();
            showToast('标签已添加', 'success');
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    async function loadRecentPending() {
        try {
            const skills = await api('/admin/skills/pending?sort=desc');
            const container = document.getElementById('recentPending');

            if (skills.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center py-8">暂无待审核技能</p>';
                return;
            }

            container.innerHTML = skills.slice(0, 5).map(s => `
                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors">
                    <div class="flex-1">
                        <div class="flex items-center gap-3">
                            <span class="font-medium text-slate-800">${s.name}</span>
                            <span class="text-sm text-slate-500">${s.user_email}</span>
                        </div>
                        <div class="flex items-center gap-2 mt-2">
                            ${s.tags.map(t => `<span class="px-2 py-0.5 bg-violet-100 text-violet-700 rounded text-xs font-medium">${t.name}</span>`).join('')}
                            <span class="text-xs text-slate-400 ml-2">${s.created_at ? new Date(s.created_at).toLocaleString() : ''}</span>
                        </div>
                    </div>
                    <button onclick="location.href='/admin/pending'" class="ml-4 px-4 py-2 bg-white border border-slate-200 text-slate-700 font-medium rounded-lg hover:bg-white hover:border-violet-300 hover:text-violet-600 transition-all text-sm">
                        查看
                    </button>
                </div>
            `).join('');
        } catch (e) {
            console.error(e);
        }
    }

    async function checkAdmin() {
        try {
            await api('/auth/me');
        } catch (e) {
            showToast('请先登录', 'error');
            window.location.href = '/login';
            return false;
        }
        return true;
    }

    (async () => {
        if (await checkAdmin()) {
            loadDashboard();
            loadTags();
            loadRecentPending();
        }
    })();
</script>
{% endblock %}
