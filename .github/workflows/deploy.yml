name: Production Deployment

on:
  push:
    branches:
      - frontend

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Debug Node
        run: |
          which node
          which npm
          node -v
          npm -v
          
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Nginx Folder
        run: |
          rm -rf /var/www/opencrab/*
          
          cp -r dist/* /var/www/opencrab/
          
          echo "Deployment successful!"
