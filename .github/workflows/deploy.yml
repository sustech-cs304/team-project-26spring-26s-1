name: Backend CI/CD

on:
  pull_request:
  push:
    branches:
      - backend-new

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      AGENT_ENV_VAULT_MASTER_KEY: ci-test-master-key
      PYTHONPATH: src
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build container
        run: docker build -t opencrab:${{ github.sha }} .

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/backend-new'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build container
        run: docker build -t opencrab:latest .

      - name: Kill existing container if exists
        run: docker rm -f opencrab || true
      
      - name: Run container
        run: docker run -d --name opencrab -p 8000:8000 -e HTTPS_PROXY=http://192.168.10.1:7890 -e AGENT_ENV_VAULT_MASTER_KEY=tmpkey -v /home/xciphand/agent_data:/app opencrab:latest
