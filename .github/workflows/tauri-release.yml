name: Tauri Desktop Release

on:
  push:
    branches:
      - frontend
      - backend-new
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Frontend branch, tag, or SHA to package
        required: false
        default: frontend
        type: string
      backend_ref:
        description: Backend branch, tag, or SHA to package
        required: false
        default: backend-new
        type: string

permissions:
  contents: read

env:
  FRONTEND_REF: ${{ github.event_name == 'push' && github.ref_name == 'frontend' && github.ref_name || github.event.inputs.frontend_ref || 'frontend' }}
  BACKEND_REF: ${{ github.event_name == 'push' && github.ref_name == 'backend-new' && github.ref_name || github.event.inputs.backend_ref || 'backend-new' }}
  PYTHON_RUNTIME_VERSION: "3.13.13"
  PYTHON_RUNTIME_RELEASE: "20260408"
  PYTHON_RUNTIME_REPO: astral-sh/python-build-standalone
  BACKEND_PACKAGE_DIR: backend-package
  PYTHON_RUNTIME_DIR: backend-package/python-runtime
  TAURI_RESOURCE_RUNTIME_DIR: frontend/src-tauri/resources/python-runtime

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      AGENT_ENV_VAULT_MASTER_KEY: ci-test-master-key
      PYTHONPATH: src
    steps:
      - name: Checkout backend source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BACKEND_REF }}
          path: backend
          fetch-depth: 0

      - name: Show selected backend ref
        run: |
          echo "backend ref: $BACKEND_REF"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync backend dependencies
        working-directory: backend
        run: |
          uv sync --extra dev

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest -q

  build:
    name: Build ${{ matrix.platform }} App
    runs-on: ${{ matrix.runner }}
    needs: backend-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            bundles: nsis
            artifact_name: opencrab-windows
            artifact_patterns: |
              frontend/src-tauri/target/release/bundle/nsis/*.exe
              frontend/src-tauri/target/*/release/bundle/nsis/*.exe
          - platform: linux
            runner: ubuntu-24.04
            bundles: deb
            artifact_name: opencrab-linux
            artifact_patterns: |
              frontend/src-tauri/target/release/bundle/deb/*.deb
              frontend/src-tauri/target/*/release/bundle/deb/*.deb
          - platform: macos
            runner: macos-latest
            bundles: app,dmg
            artifact_name: opencrab-macos
            artifact_patterns: |
              frontend/src-tauri/target/release/bundle/dmg/*.dmg
              frontend/src-tauri/target/*/release/bundle/dmg/*.dmg

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.FRONTEND_REF }}
          path: frontend
          fetch-depth: 0

      - name: Checkout backend source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BACKEND_REF }}
          path: backend
          fetch-depth: 0

      - name: Summarize selected refs
        run: |
          Write-Host "frontend ref: $env:FRONTEND_REF"
          Write-Host "backend ref: $env:BACKEND_REF"
          Write-Host "runner os: $env:RUNNER_OS"
          Write-Host "runner arch: $env:RUNNER_ARCH"
          Write-Host "bundle types: $env:TAURI_BUNDLES"
          Write-Host "artifact name: $env:ARTIFACT_NAME"
        env:
          TAURI_BUNDLES: ${{ matrix.bundles }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libfuse2t64 \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/src-tauri -> target

      - name: Verify Tauri runtime resource config
        run: |
          $tauriConfig = Get-Content frontend/src-tauri/tauri.conf.json -Raw
          if ($tauriConfig -notmatch '\"resources/python-runtime\"\s*:\s*\"python-runtime\"') {
            throw 'src-tauri/tauri.conf.json must bundle resources/python-runtime as python-runtime.'
          }

          $lib = Get-Content frontend/src-tauri/src/lib.rs -Raw
          if ($lib -notmatch 'python-runtime') {
            throw 'src-tauri/src/lib.rs does not appear to resolve the bundled python-runtime resource.'
          }

      - name: Download CPython runtime
        run: |
          $ErrorActionPreference = 'Stop'

          $arch = switch ($env:RUNNER_ARCH) {
            'ARM64' { 'aarch64' }
            'X64' { 'x86_64' }
            default { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          }

          $target = switch ($env:RUNNER_OS) {
            'Windows' { "$arch-pc-windows-msvc" }
            'Linux' { "$arch-unknown-linux-gnu" }
            'macOS' { "$arch-apple-darwin" }
            default { throw "Unsupported runner OS: $env:RUNNER_OS" }
          }

          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          $assetName = "cpython-$env:PYTHON_RUNTIME_VERSION+$env:PYTHON_RUNTIME_RELEASE-$target-install_only_stripped.tar.gz"
          $encodedAssetName = $assetName -replace '\+', '%2B'
          $downloadUrl = "https://github.com/$env:PYTHON_RUNTIME_REPO/releases/download/$env:PYTHON_RUNTIME_RELEASE/$encodedAssetName"
          $archive = Join-Path downloads $assetName

          Write-Host "Downloading CPython runtime: $assetName"
          Write-Host "Download URL: $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive

          New-Item -ItemType Directory -Force -Path $env:BACKEND_PACKAGE_DIR | Out-Null
          tar -xzf $archive -C $env:BACKEND_PACKAGE_DIR

          $extracted = Get-ChildItem -Path $env:BACKEND_PACKAGE_DIR -Directory | Select-Object -First 1
          if (-not $extracted) {
            throw "CPython archive did not extract a runtime directory."
          }

          if (Test-Path $env:PYTHON_RUNTIME_DIR) {
            Remove-Item -Recurse -Force $env:PYTHON_RUNTIME_DIR
          }

          Move-Item -Path $extracted.FullName -Destination $env:PYTHON_RUNTIME_DIR

      - name: Install backend package into CPython runtime
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:RUNNER_OS -eq 'Windows') {
            $pythonCandidates = @(
              "$env:PYTHON_RUNTIME_DIR/python.exe",
              "$env:PYTHON_RUNTIME_DIR/Scripts/python.exe"
            )
          } else {
            $pythonCandidates = @(
              "$env:PYTHON_RUNTIME_DIR/bin/python3",
              "$env:PYTHON_RUNTIME_DIR/bin/python",
              "$env:PYTHON_RUNTIME_DIR/python"
            )
          }

          $python = $pythonCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $python) {
            throw "No Python executable found in $env:PYTHON_RUNTIME_DIR."
          }

          if ($env:RUNNER_OS -ne 'Windows') {
            $binPython = Join-Path $env:PYTHON_RUNTIME_DIR 'bin/python'
            if (-not (Test-Path $binPython)) {
              Copy-Item $python $binPython -Force
              $python = $binPython
            }
          }

          Write-Host "Using CPython runtime: $python"
          & $python -VV
          & $python -m ensurepip --upgrade
          & $python -m pip install --upgrade pip setuptools wheel
          & $python -m pip install ./backend
          & $python -m pip check
          & $python -c "import agent; print('agent installed at', agent.__file__)"

          if ($env:RUNNER_OS -ne 'Windows') {
            chmod -R u+rwX,go+rX $env:PYTHON_RUNTIME_DIR
            Get-ChildItem -Path $env:PYTHON_RUNTIME_DIR/bin -File | ForEach-Object {
              chmod +x $_.FullName
            }
          }

      - name: Stage backend runtime for Tauri
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path $env:TAURI_RESOURCE_RUNTIME_DIR) {
            Remove-Item -Recurse -Force $env:TAURI_RESOURCE_RUNTIME_DIR
          }

          New-Item -ItemType Directory -Force -Path (Split-Path $env:TAURI_RESOURCE_RUNTIME_DIR) | Out-Null
          Copy-Item -Recurse -Force $env:PYTHON_RUNTIME_DIR $env:TAURI_RESOURCE_RUNTIME_DIR

          if ($env:RUNNER_OS -eq 'Windows') {
            $expectedPython = Join-Path $env:TAURI_RESOURCE_RUNTIME_DIR 'python.exe'
          } else {
            $expectedPython = Join-Path $env:TAURI_RESOURCE_RUNTIME_DIR 'bin/python'
          }

          if (-not (Test-Path $expectedPython)) {
            throw "Staged runtime is missing expected Python executable: $expectedPython"
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        working-directory: frontend
        run: npx tauri build --bundles $env:TAURI_BUNDLES
        env:
          TAURI_BUNDLES: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Ad-hoc sign macOS app and rebuild DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          app_candidates=(
            frontend/src-tauri/target/release/bundle/macos/*.app
            frontend/src-tauri/target/*/release/bundle/macos/*.app
          )

          if [ "${#app_candidates[@]}" -eq 0 ]; then
            echo "No macOS .app bundle was produced." >&2
            find frontend/src-tauri/target -maxdepth 5 -type d -path '*/bundle*' -print >&2 || true
            exit 1
          fi

          app="${app_candidates[0]}"
          app_name="$(basename "$app" .app)"
          bundle_root="$(dirname "$(dirname "$app")")"
          dmg_dir="$bundle_root/dmg"
          arch="$(printf '%s' "${RUNNER_ARCH:-unknown}" | tr '[:upper:]' '[:lower:]')"
          dmg_path="$dmg_dir/${app_name}-macos-${arch}-adhoc.dmg"
          stage_dir="${RUNNER_TEMP:-/tmp}/opencrab-dmg-stage"

          echo "Signing app bundle: $app"
          xattr -cr "$app"

          while IFS= read -r -d '' item; do
            if file "$item" | grep -Eq 'Mach-O'; then
              codesign --force --sign - --timestamp=none "$item"
            fi
          done < <(find "$app/Contents" -type f -print0)

          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | sed -n '1,30p'

          echo "Rebuilding signed DMG: $dmg_path"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir" "$dmg_dir"
          cp -a "$app" "$stage_dir/${app_name}.app"
          ln -s /Applications "$stage_dir/Applications"
          xattr -cr "$stage_dir/${app_name}.app"
          codesign --verify --deep --strict --verbose=2 "$stage_dir/${app_name}.app"

          rm -f "$dmg_dir"/*.dmg
          hdiutil create \
            -volname "$app_name" \
            -fs HFS+ \
            -srcfolder "$stage_dir" \
            -ov \
            -format UDZO \
            "$dmg_path"

          xattr -cr "$dmg_path"
          hdiutil verify "$dmg_path"

          mount_point="$(hdiutil attach "$dmg_path" -nobrowse -readonly | awk '/\/Volumes\// {print $3; exit}')"
          trap 'if [ -n "${mount_point:-}" ]; then hdiutil detach "$mount_point" >/dev/null 2>&1 || true; fi' EXIT

          codesign --verify --deep --strict --verbose=2 "$mount_point/${app_name}.app"
          "$mount_point/${app_name}.app/Contents/Resources/python-runtime/bin/python" \
            -c "import agent.main; print('bundled backend import ok')"

          hdiutil detach "$mount_point"
          mount_point=""

          ls -lh "$dmg_path"
          shasum -a 256 "$dmg_path"

      - name: Collect app artifacts
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactDir = Join-Path artifacts $env:ARTIFACT_NAME
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $patterns = @'
          ${{ matrix.artifact_patterns }}
          '@ -split "`r?`n" | Where-Object { $_.Trim() }

          $files = foreach ($pattern in $patterns) {
            Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue
          }

          $files = @($files | Sort-Object FullName -Unique)
          if ($files.Count -eq 0) {
            throw "No Tauri bundle artifacts were produced for $env:ARTIFACT_NAME."
          }

          foreach ($file in $files) {
            Copy-Item $file.FullName (Join-Path $artifactDir $file.Name) -Force
            Write-Host "Collected $($file.FullName)"
          }
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Write job summary
        run: |
          @"
          ## Tauri ${{ matrix.platform }} Release
          - frontend ref: $env:FRONTEND_REF
          - backend ref: $env:BACKEND_REF
          - backend tests: passed before packaging
          - runner: $env:RUNNER_OS / $env:RUNNER_ARCH
          - CPython runtime: $env:PYTHON_RUNTIME_REPO, $env:PYTHON_VERSION_PREFIX*
          - backend package: installed with bundled runtime pip into $env:PYTHON_RUNTIME_DIR
          - Tauri resource: $env:TAURI_RESOURCE_RUNTIME_DIR
          - bundle types: $env:TAURI_BUNDLES
          - macOS signing: ad-hoc signed app bundle and rebuilt HFS+ dmg when runner is macOS
          - download: artifact $env:ARTIFACT_NAME
          - config.yaml: add it manually beside the installed main program after packaging
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        env:
          TAURI_BUNDLES: ${{ matrix.bundles }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
