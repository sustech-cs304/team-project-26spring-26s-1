components:
  schemas:
    BbCredentialsPutResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        student_id:
          type: string
          title: Student Id
        message:
          type: string
          title: Message
          default: Shared SUSTech CAS saved in the database for both BB and TIS.
      type: object
      required:
      - student_id
      title: BbCredentialsPutResponse
    Body_upload_file_api_files_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_file_api_files_upload_post
    Body_upload_skill_api_skills_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        tag_ids:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag Ids
      type: object
      required:
      - file
      title: Body_upload_skill_api_skills_post
    CasConfigPatchRequest:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        password:
          anyOf:
          - type: string
          - type: 'null'
          title: Password
      type: object
      title: CasConfigPatchRequest
    ConversationCompletionRequest:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        request_id:
          type: string
          title: Request Id
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        created_at:
          type: integer
          title: Created At
        attachments:
          items:
            type: string
          type: array
          title: Attachments
          default: []
        need_history:
          type: boolean
          title: Need History
        restart_message_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Restart Message Id
      type: object
      required:
      - conversation_id
      - request_id
      - created_at
      - need_history
      title: ConversationCompletionRequest
    ConversationListItem:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        created_at:
          type: integer
          title: Created At
        updated_at:
          type: integer
          title: Updated At
        title:
          type: string
          title: Title
        is_active:
          type: boolean
          title: Is Active
        is_pinned:
          type: boolean
          title: Is Pinned
      type: object
      required:
      - conversation_id
      - created_at
      - updated_at
      - title
      - is_active
      - is_pinned
      title: ConversationListItem
    ConversationListResponse:
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/ConversationListItem'
          type: array
          title: Conversations
      type: object
      required:
      - conversations
      title: ConversationListResponse
    ConversationUpdateRequest:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        is_pinned:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Pinned
      type: object
      title: ConversationUpdateRequest
    DownloadedLocalSkillDetailResponse:
      properties:
        cloud_skill_id:
          type: integer
          title: Cloud Skill Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        markdown_path:
          type: string
          title: Markdown Path
        markdown_content:
          type: string
          title: Markdown Content
      type: object
      required:
      - cloud_skill_id
      - name
      - description
      - markdown_path
      - markdown_content
      title: DownloadedLocalSkillDetailResponse
    DownloadedLocalSkillResponse:
      properties:
        cloud_skill_id:
          type: integer
          title: Cloud Skill Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        markdown_path:
          type: string
          title: Markdown Path
      type: object
      required:
      - cloud_skill_id
      - name
      - description
      - markdown_path
      title: DownloadedLocalSkillResponse
    EnvVarDeleteResponse:
      properties:
        message:
          type: string
          title: Message
          description: Deletion result message.
          examples:
          - Deleted.
      additionalProperties: true
      type: object
      required:
      - message
      title: Response
    EnvVarKeyItem:
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^[A-Za-z0-9_]+$
          title: Key
          description: Trimmed environment variable name. Stored names contain only ASCII letters, digits, and underscores.
          examples:
          - OPENCRAB_TOKEN
      additionalProperties: false
      type: object
      required:
      - key
      title: EnvVarKeyItem
    EnvVarRef:
      properties:
        key:
          type: string
          minLength: 1
          title: Key
          description: Trimmed name in the global env store. Stored names contain only ASCII letters, digits, and underscores.
          x-trimmedPattern: ^[A-Za-z0-9_]+$
          x-trimmedMaxLength: 1024
          examples:
          - OPENCRAB_TOKEN
      type: object
      required:
      - key
      title: EnvVarRef
    EnvVarUpsertRequest:
      properties:
        key:
          type: string
          minLength: 1
          title: Key
          description: Environment variable name. The backend trims surrounding whitespace before validating the stored name as ASCII letters, digits, and underscores.
          x-trimmedPattern: ^[A-Za-z0-9_]+$
          x-trimmedMaxLength: 1024
          examples:
          - OPENCRAB_TOKEN
