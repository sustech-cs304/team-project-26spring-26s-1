openapi: 3.1.0
info:
  title: OpenCrab Notifications Rag Config API
  version: 0.1.0
  description: Module-level OpenAPI spec generated from current backend route entry points and augmented with standard error
    responses.
servers:
- url: /
paths:
  /api/notifications/dispatch:
    post:
      tags:
      - notifications
      summary: Dispatch a desktop notification
      description: Send one desktop notification through the backend notification layer. The request can include a body deeplink
        and optional action buttons. If the desktop notification backend is unavailable, the request is still accepted but
        `notification_id` may be null.
      operationId: dispatch_notification_api_notifications_dispatch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationDispatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDispatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/notifications/deeplink-preview/{resource}:
    get:
      tags:
      - notifications
      summary: Preview a generated deeplink
      description: Build a normalized `opencrab://` deeplink using the backend convention. Use this endpoint to verify route
        structure before wiring a notification or frontend protocol handler.
      operationId: preview_deeplink_api_notifications_deeplink_preview__resource__get
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
          title: Resource
          description: Deeplink resource/host segment passed to NotificationService.build_deeplink.
          examples:
          - tasks
      - name: entity_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Id
          description: Optional entity path segment appended to the generated deeplink.
          examples:
          - 3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
          description: Optional action query parameter.
          examples:
          - history
      - name: tab
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tab
          description: Optional tab query parameter.
          examples:
          - logs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDeeplinkPreviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/rag/sync:
    post:
      summary: Trigger Rag Cloud Sync
      operationId: trigger_rag_cloud_sync_api_rag_sync_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagCloudSyncStatusResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/rag/sync/status:
    get:
      summary: Get Rag Cloud Sync Status
      operationId: get_rag_cloud_sync_status_api_rag_sync_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagCloudSyncStatusResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/get_config:
    get:
      tags:
      - config
      summary: 获取配置接口
      operationId: api_get_config_api_get_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/patch_config:
    patch:
      tags:
      - config
      summary: 修改配置接口
      description: 修改config
      operationId: api_patch_config_api_patch_config_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppConfigPatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    BbCredentialsPutResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        student_id:
          type: string
          title: Student Id
        message:
          type: string
          title: Message
          default: Shared SUSTech CAS saved in the database for both BB and TIS.
      type: object
      required:
      - student_id
      title: BbCredentialsPutResponse
    Body_upload_file_api_files_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_file_api_files_upload_post
    Body_upload_skill_api_skills_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        tag_ids:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag Ids
      type: object
      required:
      - file
      title: Body_upload_skill_api_skills_post
    CasConfigPatchRequest:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        password:
          anyOf:
          - type: string
          - type: 'null'
          title: Password
      type: object
      title: CasConfigPatchRequest
    ConversationCompletionRequest:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        request_id:
          type: string
          title: Request Id
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        created_at:
          type: integer
          title: Created At
        attachments:
          items:
            type: string
          type: array
          title: Attachments
          default: []
        need_history:
          type: boolean
          title: Need History
        restart_message_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Restart Message Id
      type: object
      required:
      - conversation_id
      - request_id
      - created_at
      - need_history
      title: ConversationCompletionRequest
    ConversationListItem:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        created_at:
          type: integer
          title: Created At
        updated_at:
          type: integer
          title: Updated At
        title:
          type: string
          title: Title
        is_active:
          type: boolean
          title: Is Active
        is_pinned:
          type: boolean
          title: Is Pinned
      type: object
      required:
      - conversation_id
      - created_at
      - updated_at
      - title
      - is_active
      - is_pinned
      title: ConversationListItem
    ConversationListResponse:
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/ConversationListItem'
          type: array
          title: Conversations
      type: object
      required:
      - conversations
      title: ConversationListResponse
    ConversationUpdateRequest:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        is_pinned:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Pinned
      type: object
      title: ConversationUpdateRequest
    DownloadedLocalSkillDetailResponse:
      properties:
        cloud_skill_id:
          type: integer
          title: Cloud Skill Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        markdown_path:
          type: string
          title: Markdown Path
        markdown_content:
          type: string
          title: Markdown Content
      type: object
      required:
      - cloud_skill_id
      - name
      - description
      - markdown_path
      - markdown_content
      title: DownloadedLocalSkillDetailResponse
    DownloadedLocalSkillResponse:
      properties:
        cloud_skill_id:
          type: integer
          title: Cloud Skill Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        markdown_path:
          type: string
          title: Markdown Path
      type: object
      required:
      - cloud_skill_id
      - name
      - description
      - markdown_path
      title: DownloadedLocalSkillResponse
    EnvVarDeleteResponse:
      properties:
        message:
          type: string
          title: Message
      additionalProperties: true
      type: object
      required:
      - message
      title: Response
    EnvVarKeyItem:
      properties:
        key:
          type: string
          title: Key
          description: Variable name
      additionalProperties: false
      type: object
      required:
      - key
      title: EnvVarKeyItem
    EnvVarRef:
      properties:
        key:
          type: string
          title: Key
          description: Name in the global env store
      type: object
      required:
      - key
      title: EnvVarRef
    EnvVarUpsertRequest:
      properties:
        key:
          type: string
          minLength: 1
          title: Key
        value:
          type: string
          title: Value
      additionalProperties: false
      type: object
      required:
      - key
      - value
      title: EnvVarUpsertRequest
    ErrorMessageResponse:
      properties:
        message:
          type: string
          title: Message
          description: Human-readable validation error message.
          examples:
          - 'api.agent.type: Input should be OpenAI, Qwen or Anthropic'
      type: object
      required:
      - message
      title: ErrorMessageResponse
    ExecutionMode:
      type: string
      enum:
      - prompt
      - script
      title: ExecutionMode
    FileInfoResponse:
      properties:
        file_id:
          type: string
          title: File Id
          description: 文件的唯一标识符
        file_type:
          type: string
          enum:
          - image
          - pdf
          - markdown
          - text
          - other
          title: File Type
          description: 文件类型，例如：图片、PDF、Markdown等
        file_name:
          type: string
          title: File Name
          description: 文件的原始名称
      type: object
      required:
      - file_id
      - file_type
      - file_name
      title: FileInfoResponse
    FileUploadResponse:
      properties:
        file_id:
          type: string
          title: File Id
          description: 上传后预创建的消息附件唯一标识符，实际表示关系到MessageAttachment表的id
        mime_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime Type
          description: 文件的MIME类型
        file_name:
          type: string
          title: File Name
          description: 服务端确认后的合法文件名
      type: object
      required:
      - file_id
      - mime_type
      - file_name
      title: FileUploadResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LastRunStatus:
      type: string
      enum:
      - success
      - failed
      - cancelled
      title: LastRunStatus
    LastRunTrigger:
      type: string
      enum:
      - agent
      - cron
      - manual
      - telegram
      title: LastRunTrigger
    LogEntryResponse:
      properties:
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        duration_ms:
          type: integer
          title: Duration Ms
          default: 0
        id:
          type: string
          title: Id
        input_params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Input Params
        log_type:
          $ref: '#/components/schemas/LogType'
        metadata:
          $ref: '#/components/schemas/LogMetadata'
        output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output
        run_id:
          type: string
          title: Run Id
        status:
          $ref: '#/components/schemas/LogEntryStatus'
        step_index:
          type: integer
          title: Step Index
        timestamp:
          type: string
          title: Timestamp
        tool_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Name
      additionalProperties: true
      type: object
      required:
      - id
      - log_type
      - run_id
      - status
      - step_index
      - timestamp
      title: LogEntry
    LogEntryStatus:
      type: string
      enum:
      - success
      - failed
      title: LogEntryStatus
    LogMetadata:
      properties:
        chunk_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chunk Index
        exit_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Exit Code
        injected_env_keys:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Injected Env Keys
        platform:
          anyOf:
          - type: string
          - type: 'null'
          title: Platform
        python_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Python Version
        retry_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry Count
      additionalProperties: true
      type: object
      title: LogMetadata
    LogType:
      type: string
      enum:
      - script_end
      - script_start
      - script_stderr
      - script_stdout
      - tool_call
      title: LogType
    LoginRequest:
      properties:
        email:
          type: string
          title: Email
          description: Education email address
        password:
          type: string
          title: Password
          description: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: MessageResponse
    NotificationActionRequest:
      properties:
        title:
          type: string
          title: Title
          description: Button label shown in the desktop notification.
          examples:
          - 打开任务
        deeplink:
          anyOf:
          - type: string
          - type: 'null'
          title: Deeplink
          description: Optional deeplink opened when the button is pressed.
          examples:
          - opencrab://tasks/3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e
      type: object
      required:
      - title
      title: NotificationActionRequest
      additionalProperties: true
    NotificationDeeplinkPreviewResponse:
      properties:
        deeplink:
          type: string
          title: Deeplink
          description: Generated deeplink string.
          examples:
          - opencrab://tasks/3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e?action=history
      type: object
      required:
      - deeplink
      title: NotificationDeeplinkPreviewResponse
    NotificationDispatchRequest:
      properties:
        title:
          type: string
          title: Title
          description: Notification title shown by the OS notification center.
          examples:
          - 任务执行完成
        message:
          type: string
          title: Message
          description: Main notification body text.
          examples:
          - 定时任务“同步课程表”已成功完成。
        level:
          type: string
          enum:
          - info
          - success
          - warning
          - error
          title: Level
          description: Semantic notification level. `error` is mapped to a higher urgency.
          default: info
          examples:
          - success
        deeplink:
          anyOf:
          - type: string
          - type: 'null'
          title: Deeplink
          description: Optional deeplink opened when the user clicks the notification body.
          examples:
          - opencrab://runs/0ccab874-8b91-49f8-b97c-b7309ab7a0df?tab=logs
        actions:
          items:
            $ref: '#/components/schemas/NotificationActionRequest'
          type: array
          title: Actions
          description: Optional notification action buttons.
          default: []
          examples:
          - - title: 打开任务
              deeplink: opencrab://tasks/3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e
        thread:
          anyOf:
          - type: string
          - type: 'null'
          title: Thread
          description: Optional thread / group key. Some platforms use it for notification grouping.
          examples:
          - task:3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e
        timeout_s:
          anyOf:
          - type: integer
          - type: 'null'
          title: Timeout S
          description: Optional timeout override in seconds. Falls back to config when omitted.
          examples:
          - 10
      type: object
      required:
      - title
      - message
      title: NotificationDispatchRequest
      additionalProperties: true
    NotificationDispatchResponse:
      properties:
        status:
          type: string
          title: Status
          description: Dispatch result. `scheduled` means the backend accepted the notification request.
          default: scheduled
          enum:
          - scheduled
          examples:
          - scheduled
        notification_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Notification Id
          description: Backend/library notification id when provided by the platform, otherwise null.
          examples:
          - notification-1
      type: object
      title: NotificationDispatchResponse
    RagCloudSyncStatusResponse:
      properties:
        status:
          type: string
          title: Status
          enum:
          - idle
          - running
          - success
          - failed
          description: Current cloud sync lifecycle status.
          examples:
          - running
        stage:
          type: string
          title: Stage
          enum:
          - idle
          - manifest
          - download
          - import
          - completed
          - failed
          description: Current sync stage.
          examples:
          - manifest
        progress:
          type: integer
          title: Progress
          minimum: 0
          maximum: 100
          description: Integer progress percentage.
          examples:
          - 5
        message:
          type: string
          title: Message
          description: Human-readable sync status message.
          examples:
          - Fetching cloud manifest.
        knowledge_base_id:
          type: string
          title: Knowledge Base Id
          description: Cloud knowledge base identifier.
          examples:
          - default
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
          description: Cloud manifest version when known.
          examples:
          - '2026-05-15'
        downloaded_files:
          items:
            type: string
          type: array
          title: Downloaded Files
          default: []
          description: Local embedding file paths downloaded during the current sync.
          examples:
          - - rag/embeddings/cloud-cache/default/v1/a.json
        embedded_added:
          type: integer
          title: Embedded Added
          default: 0
          minimum: 0
          description: 'Non-negative embedding import counter: embedded_added.'
          examples:
          - 0
        embedded_overwritten:
          type: integer
          title: Embedded Overwritten
          default: 0
          minimum: 0
          description: 'Non-negative embedding import counter: embedded_overwritten.'
          examples:
          - 0
        embedded_failed:
          type: integer
          title: Embedded Failed
          default: 0
          minimum: 0
          description: 'Non-negative embedding import counter: embedded_failed.'
          examples:
          - 0
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Failure message when status is failed; otherwise null.
          examples:
          - Manifest response is not valid JSON.
      type: object
      required:
      - status
      - stage
      - progress
      - message
      - knowledge_base_id
      title: RagCloudSyncStatusResponse
    RegisterCaptchaRequest:
      properties:
        email:
          type: string
          title: Email
          description: Education email address
      type: object
      required:
      - email
      title: RegisterCaptchaRequest
    RegisterRequest:
      properties:
        username:
          type: string
          title: Username
          description: Username
        email:
          type: string
          title: Email
          description: Education email address
        password:
          type: string
          title: Password
          description: Password
        verificationCode:
          type: string
          title: Verificationcode
          description: Verification code
      type: object
      required:
      - username
      - email
      - password
      - verificationCode
      title: RegisterRequest
    RoutineCreateRequest:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        start_time:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start Time
        end_time:
          anyOf:
          - type: integer
          - type: 'null'
          title: End Time
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        link:
          anyOf:
          - type: string
          - type: 'null'
          title: Link
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
        inform_type:
          anyOf:
          - type: string
            enum:
            - none
            - at_start
            - 5_minutes_before
            - 10_minutes_before
            - 30_minutes_before
            - 1_hour_before
          - type: 'null'
          title: Inform Type
      type: object
      title: RoutineCreateRequest
    RoutineUpdateRequest:
      properties:
        id:
          type: integer
          title: Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        start_time:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start Time
        end_time:
          anyOf:
          - type: integer
          - type: 'null'
          title: End Time
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        link:
          anyOf:
          - type: string
          - type: 'null'
          title: Link
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
        inform_type:
          anyOf:
          - type: string
            enum:
            - none
            - at_start
            - 5_minutes_before
            - 10_minutes_before
            - 30_minutes_before
            - 1_hour_before
          - type: 'null'
          title: Inform Type
      type: object
      required:
      - id
      title: RoutineUpdateRequest
    RunDetailResponse:
      properties:
        id:
          type: string
          title: Id
        task_id:
          type: string
          title: Task Id
        status:
          $ref: '#/components/schemas/RunHistoryStatus'
        trigger:
          $ref: '#/components/schemas/LastRunTrigger'
        started_at:
          type: string
          title: Started At
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        override_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Override Prompt
        logs:
          items:
