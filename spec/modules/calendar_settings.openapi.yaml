openapi: 3.1.0
info:
  title: OpenCrab Calendar Settings API
  version: 0.1.0
  description: Module-level OpenAPI spec generated from current backend route entry
    points and augmented with standard error responses.
servers:
- url: /
paths:
  /api/settings/tis/credentials:
    get:
      tags:
      - settings
      summary: Get Tis Credentials Status
      description: Return whether shared CAS credentials are set (password is never
        returned).
      operationId: get_tis_credentials_status_api_settings_tis_credentials_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TisCredentialsGetResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - settings
      summary: Put Tis Credentials
      description: Store shared CAS in the database for BB/TIS tool resolution.
      operationId: put_tis_credentials_api_settings_tis_credentials_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TisCredentialsBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TisCredentialsPutResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - settings
      summary: Delete Tis Credentials
      description: Clear shared CAS from the database; tools fall back to process
        env only.
      operationId: delete_tis_credentials_api_settings_tis_credentials_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TisCredentialsDeleteResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/patch_cas:
    patch:
      tags:
      - settings
      summary: Patch Cas
      operationId: patch_cas_api_patch_cas_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasConfigPatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/settings/bb/credentials:
    get:
      tags:
      - settings
      summary: Get Bb Credentials Status
      description: 'Same as ``GET /settings/tis/credentials``: shared CAS status (password
        never returned).'
      operationId: get_bb_credentials_status_api_settings_bb_credentials_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TisCredentialsGetResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - settings
      summary: Put Bb Credentials
      description: Save shared SUSTech CAS in Global Settings; BB and TIS tools read
        the same pair.
      operationId: put_bb_credentials_api_settings_bb_credentials_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TisCredentialsBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BbCredentialsPutResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - settings
      summary: Delete Bb Credentials
      description: Clear shared CAS credentials (same as ``DELETE .../tis/credentials``).
      operationId: delete_bb_credentials_api_settings_bb_credentials_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TisCredentialsDeleteResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/events/create:
    post:
      tags:
      - routine-events
      summary: Create Routine
      operationId: create_routine_api_events_create_post
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/RoutineCreateRequest'
              type: array
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineMutationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/events/modify:
    put:
      tags:
      - routine-events
      summary: Update Routine
      operationId: update_routine_api_events_modify_put
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/RoutineUpdateRequest'
              type: array
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineMutationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/events:
    get:
      tags:
      - routine-events
      summary: Query events (query string only; no path parameters)
      operationId: query_routines_api_events_get
      parameters:
      - name: id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
          description: If set, return exactly one row by id; mutually exclusive with
            start_time/end_time range
          title: Id
          examples:
          - 1
        description: If set, return exactly one row by id; mutually exclusive with
          start_time/end_time range
      - name: start_time
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
          description: 'Range query: start Unix seconds (use with end_time)'
          title: Start Time
          examples:
          - 1715750400
        description: 'Range query: start Unix seconds (use with end_time)'
      - name: startTime
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
          description: Alias for start_time (camelCase)
          title: Starttime
          examples:
          - 1715750400
        description: Alias for start_time (camelCase)
      - name: end_time
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
          description: 'Range query: end Unix seconds'
          title: End Time
          examples:
          - 1715750400
        description: 'Range query: end Unix seconds'
      - name: endTime
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
          description: Alias for end_time (camelCase)
          title: Endtime
          examples:
          - 1715750400
        description: Alias for end_time (camelCase)
      - name: key_word
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive substring match on title and description (event_name,
            detail)
          title: Key Word
          examples:
          - project
        description: Case-insensitive substring match on title and description (event_name,
          detail)
      - name: keyWord
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Alias for key_word (camelCase)
          title: Keyword
          examples:
          - project
        description: Alias for key_word (camelCase)
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact match on calendar source title
          title: Source
          examples:
          - user
        description: Exact match on calendar source title
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/events/delete:
    delete:
      tags:
      - routine-events
      summary: Delete Routines
      operationId: delete_routines_api_events_delete_delete
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: integer
                format: int64
              type: array
              title: Body
              description: Array of routine event ids to delete. Empty array is accepted
                and returns no-op success.
              examples:
              - - 1
                - 2
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineMutationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/events/sources:
    get:
      tags:
      - routine-events
      summary: Get Sources
      operationId: get_sources_api_events_sources_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutineSourceResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/events/sources/{source_id}:
    patch:
      tags:
      - routine-events
      summary: Update Source
      operationId: update_source_api_events_sources__source_id__patch
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
          format: int64
          description: Calendar source id.
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineSourceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/events/update/{source_id}:
    patch:
      tags:
      - routine-events
      summary: Update Source Events
      description: Replace one calendar source from BB/TIS sync or legacy iCal source
        id.
      operationId: update_source_events_api_events_update__source_id__patch
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
          description: Managed source name (bb/tis) or numeric legacy iCal source
            id.
          minLength: 1
          examples:
          - bb
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSyncResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    BbCredentialsPutResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        student_id:
          type: string
          title: Student Id
        message:
          type: string
          title: Message
          default: Shared SUSTech CAS saved in the database for both BB and TIS.
      type: object
      required:
      - student_id
      title: BbCredentialsPutResponse
    Body_upload_file_api_files_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_file_api_files_upload_post
    Body_upload_skill_api_skills_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        tag_ids:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag Ids
      type: object
      required:
      - file
      title: Body_upload_skill_api_skills_post
    CasConfigPatchRequest:
      properties:
        id:
          anyOf:
          - type: string
            description: Optional CAS student id / username to patch. Omitted or null
              keeps the previous value.
            examples:
            - '12345678'
          - type: 'null'
          title: Id
        password:
          anyOf:
          - type: string
            description: Optional CAS password to patch. Omitted or null keeps the
              previous value.
            examples:
            - correct-horse-battery-staple
          - type: 'null'
          title: Password
      type: object
      title: CasConfigPatchRequest
    ConversationCompletionRequest:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        request_id:
          type: string
          title: Request Id
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        created_at:
          type: integer
          title: Created At
        attachments:
          items:
            type: string
          type: array
          title: Attachments
          default: []
        need_history:
          type: boolean
          title: Need History
        restart_message_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Restart Message Id
      type: object
      required:
      - conversation_id
      - request_id
      - created_at
      - need_history
      title: ConversationCompletionRequest
    ConversationListItem:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        created_at:
          type: integer
          title: Created At
        updated_at:
          type: integer
          title: Updated At
        title:
          type: string
          title: Title
        is_active:
          type: boolean
          title: Is Active
        is_pinned:
          type: boolean
          title: Is Pinned
      type: object
      required:
      - conversation_id
      - created_at
      - updated_at
      - title
      - is_active
      - is_pinned
      title: ConversationListItem
    ConversationListResponse:
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/ConversationListItem'
          type: array
          title: Conversations
      type: object
      required:
      - conversations
      title: ConversationListResponse
    ConversationUpdateRequest:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        is_pinned:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Pinned
      type: object
      title: ConversationUpdateRequest
    DownloadedLocalSkillDetailResponse:
      properties:
        cloud_skill_id:
          type: integer
          title: Cloud Skill Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        markdown_path:
          type: string
          title: Markdown Path
        markdown_content:
          type: string
          title: Markdown Content
      type: object
      required:
      - cloud_skill_id
      - name
      - description
      - markdown_path
      - markdown_content
      title: DownloadedLocalSkillDetailResponse
    DownloadedLocalSkillResponse:
      properties:
        cloud_skill_id:
          type: integer
          title: Cloud Skill Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        markdown_path:
          type: string
          title: Markdown Path
      type: object
      required:
      - cloud_skill_id
      - name
      - description
      - markdown_path
      title: DownloadedLocalSkillResponse
    EnvVarDeleteResponse:
      properties:
        message:
          type: string
          title: Message
      additionalProperties: true
      type: object
      required:
      - message
      title: Response
    EnvVarKeyItem:
      properties:
        key:
          type: string
          title: Key
          description: Variable name
      additionalProperties: false
      type: object
      required:
      - key
      title: EnvVarKeyItem
    EnvVarRef:
      properties:
        key:
          type: string
          title: Key
          description: Name in the global env store
      type: object
      required:
      - key
      title: EnvVarRef
    EnvVarUpsertRequest:
      properties:
        key:
          type: string
          minLength: 1
          title: Key
        value:
          type: string
          title: Value
      additionalProperties: false
      type: object
      required:
      - key
      - value
      title: EnvVarUpsertRequest
    ErrorMessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: ErrorMessageResponse
    ExecutionMode:
      type: string
      enum:
      - prompt
      - script
      title: ExecutionMode
    FileInfoResponse:
      properties:
        file_id:
          type: string
          title: File Id
          description: 文件的唯一标识符
        file_type:
          type: string
          enum:
          - image
          - pdf
          - markdown
          - text
          - other
          title: File Type
          description: 文件类型，例如：图片、PDF、Markdown等
        file_name:
          type: string
          title: File Name
          description: 文件的原始名称
      type: object
      required:
      - file_id
      - file_type
      - file_name
      title: FileInfoResponse
    FileUploadResponse:
      properties:
        file_id:
          type: string
          title: File Id
          description: 上传后预创建的消息附件唯一标识符，实际表示关系到MessageAttachment表的id
        mime_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime Type
          description: 文件的MIME类型
        file_name:
          type: string
          title: File Name
          description: 服务端确认后的合法文件名
      type: object
      required:
      - file_id
      - mime_type
      - file_name
      title: FileUploadResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LastRunStatus:
      type: string
      enum:
      - success
      - failed
      - cancelled
      title: LastRunStatus
    LastRunTrigger:
      type: string
      enum:
      - agent
      - cron
      - manual
      - telegram
      title: LastRunTrigger
    LogEntryResponse:
      properties:
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        duration_ms:
          type: integer
          title: Duration Ms
          default: 0
        id:
          type: string
          title: Id
        input_params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Input Params
        log_type:
          $ref: '#/components/schemas/LogType'
        metadata:
          $ref: '#/components/schemas/LogMetadata'
        output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output
        run_id:
          type: string
          title: Run Id
        status:
          $ref: '#/components/schemas/LogEntryStatus'
        step_index:
          type: integer
          title: Step Index
        timestamp:
          type: string
          title: Timestamp
        tool_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Name
      additionalProperties: true
      type: object
      required:
      - id
      - log_type
      - run_id
      - status
      - step_index
      - timestamp
      title: LogEntry
    LogEntryStatus:
      type: string
      enum:
      - success
      - failed
      title: LogEntryStatus
    LogMetadata:
      properties:
        chunk_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chunk Index
        exit_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Exit Code
        injected_env_keys:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Injected Env Keys
        platform:
          anyOf:
          - type: string
          - type: 'null'
          title: Platform
        python_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Python Version
        retry_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry Count
      additionalProperties: true
      type: object
      title: LogMetadata
    LogType:
      type: string
      enum:
      - script_end
      - script_start
      - script_stderr
      - script_stdout
      - tool_call
      title: LogType
    LoginRequest:
      properties:
        email:
          type: string
          title: Email
          description: Education email address
        password:
          type: string
          title: Password
          description: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: MessageResponse
    NotificationActionRequest:
      properties:
        title:
          type: string
          title: Title
          description: Button label shown in the desktop notification.
          examples:
          - 打开任务
        deeplink:
          anyOf:
          - type: string
          - type: 'null'
          title: Deeplink
          description: Optional deeplink opened when the button is pressed.
          examples:
          - opencrab://tasks/3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e
      type: object
      required:
      - title
      title: NotificationActionRequest
    NotificationDeeplinkPreviewResponse:
      properties:
        deeplink:
          type: string
          title: Deeplink
          description: Generated deeplink string.
          examples:
          - opencrab://tasks/3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e?action=history
      type: object
      required:
      - deeplink
      title: NotificationDeeplinkPreviewResponse
    NotificationDispatchRequest:
      properties:
        title:
          type: string
          title: Title
          description: Notification title shown by the OS notification center.
          examples:
          - 任务执行完成
        message:
          type: string
          title: Message
          description: Main notification body text.
          examples:
          - 定时任务“同步课程表”已成功完成。
        level:
          type: string
