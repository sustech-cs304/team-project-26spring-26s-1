openapi: 3.1.0
info:
  title: OpenCrab Skills Auth API
  version: 0.1.0
  description: Module-level OpenAPI spec generated from current backend route entry points and augmented with standard error
    responses.
servers:
- url: /
paths:
  /api/auth/register/captcha:
    post:
      tags:
      - skills
      summary: Send Register Captcha
      operationId: send_register_captcha_api_auth_register_captcha_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCaptchaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Send Register Captcha Api Auth Register Captcha Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/register:
    post:
      tags:
      - skills
      summary: Register User
      operationId: register_user_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Register User Api Auth Register Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/auth/login:
    post:
      tags:
      - skills
      summary: Login User
      operationId: login_user_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Login User Api Auth Login Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/me:
    get:
      tags:
      - skills
      summary: Get Current User
      operationId: get_current_user_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Current User Api Auth Me Get
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/skills:
    get:
      tags:
      - skills
      summary: List Skills
      operationId: list_skills_api_skills_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
          description: One-based page index.
          examples:
          - 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
          description: Number of records per page.
          examples:
          - 20
      - name: tag_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tag Id
          description: Optional tag filter forwarded to the cloud skills service.
          examples:
          - 1
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
          description: Optional search string. The implementation trims whitespace and omits blank values.
          examples:
          - writer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response List Skills Api Skills Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - skills
      summary: Upload Skill
      operationId: upload_skill_api_skills_post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_skill_api_skills_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Upload Skill Api Skills Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/skills/me:
    get:
      tags:
      - skills
      summary: List My Skills
      operationId: list_my_skills_api_skills_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response List My Skills Api Skills Me Get
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/skills/downloaded:
    get:
      tags:
      - skills
      summary: List Downloaded Skills
      operationId: list_downloaded_skills_api_skills_downloaded_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DownloadedLocalSkillResponse'
                type: array
                title: Response List Downloaded Skills Api Skills Downloaded Get
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/skills/downloaded/{skill_id}:
    get:
      tags:
      - skills
      summary: Get Downloaded Skill Detail
      operationId: get_downloaded_skill_detail_api_skills_downloaded__skill_id__get
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: integer
          title: Skill Id
          description: Integer skill identifier accepted by the current route implementation.
          examples:
          - 7
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadedLocalSkillDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/skills/{skill_id}:
    get:
      tags:
      - skills
      summary: Get Skill Detail
      operationId: get_skill_detail_api_skills__skill_id__get
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: integer
          title: Skill Id
          description: Integer skill identifier accepted by the current route implementation.
          examples:
          - 7
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Skill Detail Api Skills  Skill Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/skills/{skill_id}/download:
    get:
      tags:
      - skills
      summary: Download Skill
      operationId: download_skill_api_skills__skill_id__download_get
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: integer
          title: Skill Id
          description: Integer skill identifier accepted by the current route implementation.
          examples:
          - 7
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tags:
    get:
      tags:
      - skills
      summary: List Tags
      operationId: list_tags_api_tags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response List Tags Api Tags Get
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/skill/{skill_id}/delete:
    delete:
      tags:
      - skills
      summary: Delete Submission Skill
      operationId: delete_submission_skill_api_skill__skill_id__delete_delete
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: integer
          title: Skill Id
          description: Integer skill identifier accepted by the current route implementation.
          examples:
          - 7
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Delete Submission Skill Api Skill  Skill Id  Delete Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/skill/{skill_id}/uninstall:
    post:
      tags:
      - skills
      summary: Uninstall Skill
      operationId: uninstall_skill_api_skill__skill_id__uninstall_post
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: integer
          title: Skill Id
          description: Integer skill identifier accepted by the current route implementation.
          examples:
          - 7
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    BbCredentialsPutResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        student_id:
          type: string
          title: Student Id
        message:
          type: string
          title: Message
          default: Shared SUSTech CAS saved in the database for both BB and TIS.
      type: object
      required:
      - student_id
      title: BbCredentialsPutResponse
    Body_upload_file_api_files_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_file_api_files_upload_post
    Body_upload_skill_api_skills_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Markdown skill package file uploaded as multipart/form-data.
          examples:
          - skill.md
        tag_ids:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag Ids
          description: Optional comma-separated tag id string forwarded to the cloud skills service when non-blank.
          examples:
          - 1,2
      type: object
      required:
      - file
      title: Body_upload_skill_api_skills_post
    CasConfigPatchRequest:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        password:
          anyOf:
          - type: string
          - type: 'null'
          title: Password
      type: object
      title: CasConfigPatchRequest
    ConversationCompletionRequest:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        request_id:
          type: string
          title: Request Id
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        created_at:
          type: integer
          title: Created At
        attachments:
          items:
            type: string
          type: array
          title: Attachments
          default: []
        need_history:
          type: boolean
          title: Need History
        restart_message_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Restart Message Id
      type: object
      required:
      - conversation_id
      - request_id
      - created_at
      - need_history
      title: ConversationCompletionRequest
    ConversationListItem:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        created_at:
          type: integer
          title: Created At
        updated_at:
          type: integer
          title: Updated At
        title:
          type: string
          title: Title
        is_active:
          type: boolean
          title: Is Active
        is_pinned:
          type: boolean
          title: Is Pinned
      type: object
      required:
      - conversation_id
      - created_at
      - updated_at
      - title
      - is_active
      - is_pinned
      title: ConversationListItem
    ConversationListResponse:
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/ConversationListItem'
          type: array
          title: Conversations
      type: object
      required:
      - conversations
      title: ConversationListResponse
    ConversationUpdateRequest:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        is_pinned:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Pinned
      type: object
      title: ConversationUpdateRequest
    DownloadedLocalSkillDetailResponse:
      properties:
        cloud_skill_id:
          type: integer
          title: Cloud Skill Id
          description: Cloud skill identifier stored locally.
          examples:
          - 7
        name:
          type: string
          title: Name
          description: Skill display name from the cloud skill detail.
          examples:
          - Writer
        description:
          type: string
          title: Description
          description: Skill description from the cloud skill detail.
          examples:
          - Writes concise summaries.
        markdown_path:
          type: string
          title: Markdown Path
          description: Absolute or configured local markdown path for the downloaded skill.
          examples:
          - workspace/skills/7/Writer.md
        markdown_content:
          type: string
          title: Markdown Content
          description: UTF-8 markdown content read from markdown_path.
          examples:
          - '# Writer

            '
      type: object
      required:
      - cloud_skill_id
      - name
      - description
      - markdown_path
      - markdown_content
      title: DownloadedLocalSkillDetailResponse
    DownloadedLocalSkillResponse:
      properties:
        cloud_skill_id:
          type: integer
          title: Cloud Skill Id
          description: Cloud skill identifier stored locally.
          examples:
          - 7
        name:
          type: string
          title: Name
          description: Skill display name from the cloud skill detail.
          examples:
          - Writer
        description:
          type: string
          title: Description
          description: Skill description from the cloud skill detail.
          examples:
          - Writes concise summaries.
        markdown_path:
          type: string
          title: Markdown Path
          description: Absolute or configured local markdown path for the downloaded skill.
          examples:
          - workspace/skills/7/Writer.md
      type: object
      required:
      - cloud_skill_id
      - name
      - description
      - markdown_path
      title: DownloadedLocalSkillResponse
    EnvVarDeleteResponse:
      properties:
        message:
          type: string
          title: Message
      additionalProperties: true
      type: object
      required:
      - message
      title: Response
    EnvVarKeyItem:
      properties:
        key:
          type: string
          title: Key
          description: Variable name
      additionalProperties: false
      type: object
      required:
      - key
      title: EnvVarKeyItem
    EnvVarRef:
      properties:
        key:
          type: string
          title: Key
          description: Name in the global env store
      type: object
      required:
      - key
      title: EnvVarRef
    EnvVarUpsertRequest:
      properties:
        key:
          type: string
          minLength: 1
          title: Key
        value:
          type: string
          title: Value
      additionalProperties: false
      type: object
      required:
      - key
      - value
      title: EnvVarUpsertRequest
    ErrorMessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: ErrorMessageResponse
    ExecutionMode:
      type: string
      enum:
      - prompt
      - script
      title: ExecutionMode
    FileInfoResponse:
      properties:
        file_id:
          type: string
          title: File Id
          description: 文件的唯一标识符
        file_type:
          type: string
          enum:
          - image
          - pdf
          - markdown
          - text
          - other
          title: File Type
          description: 文件类型，例如：图片、PDF、Markdown等
        file_name:
          type: string
          title: File Name
          description: 文件的原始名称
      type: object
      required:
      - file_id
      - file_type
      - file_name
      title: FileInfoResponse
    FileUploadResponse:
      properties:
        file_id:
          type: string
          title: File Id
          description: 上传后预创建的消息附件唯一标识符，实际表示关系到MessageAttachment表的id
        mime_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime Type
          description: 文件的MIME类型
        file_name:
          type: string
          title: File Name
          description: 服务端确认后的合法文件名
      type: object
      required:
      - file_id
      - mime_type
      - file_name
      title: FileUploadResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LastRunStatus:
      type: string
      enum:
      - success
      - failed
      - cancelled
      title: LastRunStatus
    LastRunTrigger:
      type: string
      enum:
      - agent
      - cron
      - manual
      - telegram
      title: LastRunTrigger
    LogEntryResponse:
      properties:
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        duration_ms:
          type: integer
          title: Duration Ms
          default: 0
        id:
          type: string
          title: Id
        input_params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Input Params
        log_type:
          $ref: '#/components/schemas/LogType'
        metadata:
          $ref: '#/components/schemas/LogMetadata'
        output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output
        run_id:
          type: string
          title: Run Id
        status:
          $ref: '#/components/schemas/LogEntryStatus'
        step_index:
          type: integer
          title: Step Index
        timestamp:
          type: string
          title: Timestamp
        tool_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Name
      additionalProperties: true
      type: object
      required:
      - id
      - log_type
      - run_id
      - status
      - step_index
      - timestamp
      title: LogEntry
    LogEntryStatus:
      type: string
      enum:
      - success
      - failed
      title: LogEntryStatus
    LogMetadata:
      properties:
        chunk_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chunk Index
        exit_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Exit Code
        injected_env_keys:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Injected Env Keys
        platform:
          anyOf:
          - type: string
          - type: 'null'
          title: Platform
        python_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Python Version
        retry_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry Count
      additionalProperties: true
      type: object
      title: LogMetadata
    LogType:
      type: string
      enum:
      - script_end
      - script_start
      - script_stderr
      - script_stdout
      - tool_call
      title: LogType
    LoginRequest:
      properties:
        email:
          type: string
          title: Email
          description: Education email address
          examples: &id001
          - user@example.edu
        password:
          type: string
          title: Password
          description: Password
          examples:
          - correct horse battery staple
      type: object
      required:
      - email
      - password
      title: LoginRequest
      additionalProperties: true
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
          examples:
          - 下载成功
      type: object
      required:
      - message
      title: MessageResponse
    NotificationActionRequest:
      properties:
        title:
          type: string
          title: Title
          description: Button label shown in the desktop notification.
          examples:
          - 打开任务
        deeplink:
          anyOf:
          - type: string
          - type: 'null'
          title: Deeplink
          description: Optional deeplink opened when the button is pressed.
          examples:
          - opencrab://tasks/3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e
      type: object
      required:
      - title
      title: NotificationActionRequest
    NotificationDeeplinkPreviewResponse:
      properties:
        deeplink:
          type: string
          title: Deeplink
          description: Generated deeplink string.
          examples:
          - opencrab://tasks/3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e?action=history
      type: object
      required:
      - deeplink
      title: NotificationDeeplinkPreviewResponse
    NotificationDispatchRequest:
      properties:
        title:
          type: string
          title: Title
          description: Notification title shown by the OS notification center.
          examples:
          - 任务执行完成
        message:
          type: string
          title: Message
          description: Main notification body text.
          examples:
          - 定时任务“同步课程表”已成功完成。
        level:
          type: string
          enum:
          - info
          - success
          - warning
          - error
          title: Level
          description: Semantic notification level. `error` is mapped to a higher urgency.
          default: info
          examples:
          - success
        deeplink:
          anyOf:
          - type: string
          - type: 'null'
          title: Deeplink
          description: Optional deeplink opened when the user clicks the notification body.
          examples:
          - opencrab://runs/0ccab874-8b91-49f8-b97c-b7309ab7a0df?tab=logs
        actions:
          items:
            $ref: '#/components/schemas/NotificationActionRequest'
          type: array
          title: Actions
          description: Optional notification action buttons.
        thread:
          anyOf:
          - type: string
          - type: 'null'
          title: Thread
          description: Optional thread / group key. Some platforms use it for notification grouping.
          examples:
          - task:3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e
        timeout_s:
