    GenericErrorResponse:
      type: object
      title: GenericErrorResponse
      description: Generic error envelope used for semantic request errors, missing resources, conflicts, rate limits, and
        unexpected server errors.
      properties:
        detail:
          description: Human-readable error string or structured error details.
          anyOf:
          - type: string
          - type: object
            additionalProperties: true
          - type: array
            items: {}
        message:
          type: string
        code:
          type: string
      additionalProperties: true
  responses:
    BadRequest:
      description: Bad request. The request is syntactically valid but fails semantic validation, such as invalid state transitions,
        unsafe values, malformed identifiers, or unsupported business input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
    Unauthorized:
      description: Unauthorized. Authentication is missing, expired, or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
    NotFound:
      description: Not found. The requested resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
    Conflict:
      description: Conflict. The request conflicts with current server state, such as duplicate resources or deleting a resource
        currently in use.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
    TooManyRequests:
      description: Too many requests. The caller has exceeded a server-side rate limit or concurrent operation limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
    ValidationError:
      description: Request validation error. FastAPI/Pydantic validation failed for path, query, header, or body parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
    InternalServerError:
      description: Internal server error. An unexpected server-side failure occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
    ServiceUnavailable:
      description: Service unavailable. A required internal or external dependency is not configured or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
