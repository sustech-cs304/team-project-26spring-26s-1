      title: LoginRequest
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: MessageResponse
    NotificationActionRequest:
      properties:
        title:
          type: string
          title: Title
          description: Button label shown in the desktop notification.
          examples:
          - 打开任务
        deeplink:
          anyOf:
          - type: string
          - type: 'null'
          title: Deeplink
          description: Optional deeplink opened when the button is pressed.
          examples:
          - opencrab://tasks/3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e
      type: object
      required:
      - title
      title: NotificationActionRequest
    NotificationDeeplinkPreviewResponse:
      properties:
        deeplink:
          type: string
          title: Deeplink
          description: Generated deeplink string.
          examples:
          - opencrab://tasks/3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e?action=history
      type: object
      required:
      - deeplink
      title: NotificationDeeplinkPreviewResponse
    NotificationDispatchRequest:
      properties:
        title:
          type: string
          title: Title
          description: Notification title shown by the OS notification center.
          examples:
          - 任务执行完成
        message:
          type: string
          title: Message
          description: Main notification body text.
          examples:
          - 定时任务“同步课程表”已成功完成。
        level:
          type: string
          enum:
          - info
          - success
          - warning
          - error
          title: Level
          description: Semantic notification level. `error` is mapped to a higher
            urgency.
          default: info
          examples:
          - success
        deeplink:
          anyOf:
          - type: string
          - type: 'null'
          title: Deeplink
          description: Optional deeplink opened when the user clicks the notification
            body.
          examples:
          - opencrab://runs/0ccab874-8b91-49f8-b97c-b7309ab7a0df?tab=logs
        actions:
          items:
            $ref: '#/components/schemas/NotificationActionRequest'
          type: array
          title: Actions
          description: Optional notification action buttons.
        thread:
          anyOf:
          - type: string
          - type: 'null'
          title: Thread
          description: Optional thread / group key. Some platforms use it for notification
            grouping.
          examples:
          - task:3b11e1a9-7c45-40cf-9dd6-bbfa6308b54e
        timeout_s:
          anyOf:
          - type: integer
          - type: 'null'
          title: Timeout S
          description: Optional timeout override in seconds. Falls back to config
            when omitted.
          examples:
          - 10
      type: object
      required:
      - title
      - message
      title: NotificationDispatchRequest
    NotificationDispatchResponse:
      properties:
        status:
          type: string
          title: Status
          description: Dispatch result. `scheduled` means the backend accepted the
            notification request.
          default: scheduled
        notification_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Notification Id
          description: Backend/library notification id when provided by the platform,
            otherwise null.
      type: object
      title: NotificationDispatchResponse
