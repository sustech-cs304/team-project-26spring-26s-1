            text are rejected.
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        file_type:
          type: string
          enum:
          - image
          - pdf
          - markdown
          - text
          - other
          title: File Type
          description: Coarse file category inferred from the stored display filename
            extension.
          examples:
          - text
        file_name:
          type: string
          title: File Name
          description: Server-confirmed display filename.
          minLength: 1
          maxLength: 512
          examples:
          - notes.md
      type: object
      required:
      - file_id
      - file_type
      - file_name
      title: FileInfoResponse
    FileUploadResponse:
      properties:
        file_id:
          type: string
          title: File Id
          description: Canonical UUID string. Uppercase UUID text is normalized by
            implementation; braces, path traversal, overlong values, and non-UUID
            text are rejected.
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          examples:
