openapi: 3.1.0
info:
  title: OpenCrab Files API
  version: 0.1.0
  description: Module-level OpenAPI spec generated from current backend route entry
    points and augmented with standard error responses.
servers:
- url: /
paths:
  /api/files/upload:
    post:
      summary: Upload File
      description: Upload a file and return only after the attachment is ready for
        downstream consumption.
      operationId: upload_file_api_files_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_api_files_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '413':
          $ref: '#/components/responses/RequestEntityTooLarge'
        '417':
          $ref: '#/components/responses/ExpectationFailed'
  /api/file/{file_id}:
    get:
      summary: Get File
      operationId: get_file_api_file__file_id__get
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          description: Canonical UUID string. Uppercase UUID text is normalized by
            implementation; braces, path traversal, overlong values, and non-UUID
            text are rejected.
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Raw stored file bytes.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/files/{message_id}/{file_id}/info:
    get:
      summary: Get File Info
      operationId: get_file_info_api_files__message_id___file_id__info_get
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          description: Canonical UUID string. Uppercase UUID text is normalized by
            implementation; braces, path traversal, overlong values, and non-UUID
            text are rejected.
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
          title: File Id
      - name: message_id
        in: path
        required: true
        schema:
          type: string
          description: Canonical UUID string. Uppercase UUID text is normalized by
            implementation; braces, path traversal, overlong values, and non-UUID
            text are rejected.
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
          title: Message Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    BbCredentialsPutResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        student_id:
          type: string
          title: Student Id
        message:
          type: string
          title: Message
          default: Shared SUSTech CAS saved in the database for both BB and TIS.
      type: object
      required:
      - student_id
      title: BbCredentialsPutResponse
    Body_upload_file_api_files_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          format: binary
          description: 'Multipart file part. Content must be non-empty and at most
            10 MiB. Filename must be non-empty after trim, at most 512 characters,
            not . or .., and must not contain / or \ path separators. Allowed extensions:
            .bmp, .docx, .gif, .jpeg, .jp2, .jpg, .md, .pdf, .png, .pptx, .txt, .webp,
            .xls, .xlsx.'
      type: object
      required:
      - file
      title: Body_upload_file_api_files_upload_post
    Body_upload_skill_api_skills_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        tag_ids:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag Ids
      type: object
      required:
      - file
      title: Body_upload_skill_api_skills_post
    CasConfigPatchRequest:
