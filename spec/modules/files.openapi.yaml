        mime_type:
          anyOf:
          - type: string
            enum:
            - application/octet-stream
            - application/pdf
            - application/vnd.ms-excel
            - application/vnd.ms-powerpoint
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/zip
            - image/bmp
            - image/gif
            - image/jp2
            - image/jpeg
            - image/jpeg2000
            - image/jpx
            - image/png
            - image/webp
            - image/x-ms-bmp
            - text/markdown
            - text/plain
            description: Detected MIME type for supported uploads; may be null if
              the platform cannot infer it.
            examples:
            - text/plain
          - type: 'null'
          title: Mime Type
        file_name:
          type: string
          title: File Name
          description: Server-confirmed display filename.
          minLength: 1
          maxLength: 512
          examples:
          - notes.md
      type: object
      required:
      - file_id
      - mime_type
      - file_name
      title: FileUploadResponse
    HTTPValidationError:
